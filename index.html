    // -------------------------------------------------------------
    // AUDIO ENGINE & DOWNLOAD HELPER
    // -------------------------------------------------------------
    const DEFAULT_WORKING_MP3 = 'https://commondatastorage.googleapis.com/codeskulptor-demos/DDR_m3g.mp3';

    class AudioEngine {
      constructor() {
        this.audioElement = new Audio();
        this.audioCtx = null;
        this.synthOscillator = null;
        this.synthGain = null;
        this.analyser = null;
        this.isSynthPlaying = false;
        this.currentTrackId = null;
        this.currentAudioUrl = null;
        this.onTimeUpdateCallback = null;
        this.onEndedCallback = null;
        this.onErrorCallback = null;
        this.tickerInterval = null;
        this.syntheticCurrentTime = 0;
      }

      triggerHaptic(type = 'light') {
        try {
          const tg = window.Telegram?.WebApp;
          if (tg?.HapticFeedback) {
            if (type === 'selection') tg.HapticFeedback.selectionChanged();
            else if (type === 'notification') tg.HapticFeedback.notificationOccurred('success');
            else tg.HapticFeedback.impactOccurred(type);
          }
        } catch (e) {}
      }

      initAudioContext() {
        if (!this.audioCtx && typeof window !== 'undefined') {
          const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
          if (AudioCtxClass) {
            this.audioCtx = new AudioCtxClass();
            this.analyser = this.audioCtx.createAnalyser();
            this.analyser.fftSize = 64;
          }
        }
        if (this.audioCtx && this.audioCtx.state === 'suspended') {
          this.audioCtx.resume().catch(() => {});
        }
      }

      startSynthFallback(freq = 220) {
        try {
          this.initAudioContext();
          if (!this.audioCtx) return;
          this.stopSynth();
          const osc = this.audioCtx.createOscillator();
          const gain = this.audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
          gain.gain.setValueAtTime(0.08, this.audioCtx.currentTime);
          if (this.analyser) {
            osc.connect(gain);
            gain.connect(this.analyser);
            this.analyser.connect(this.audioCtx.destination);
          } else {
            osc.connect(gain);
            gain.connect(this.audioCtx.destination);
          }
          osc.start();
          this.synthOscillator = osc;
          this.synthGain = gain;
          this.isSynthPlaying = true;
        } catch (e) {}
      }

      stopSynth() {
        if (this.synthOscillator) {
          try {
            this.synthOscillator.stop();
            this.synthOscillator.disconnect();
          } catch (e) {}
          this.synthOscillator = null;
        }
        this.isSynthPlaying = false;
      }

      startProgressTicker() {
        this.stopProgressTicker();
        this.tickerInterval = setInterval(() => {
          if (this.audioElement && !isNaN(this.audioElement.currentTime) && this.audioElement.currentTime >= 0) {
            this.syntheticCurrentTime = this.audioElement.currentTime;
            if (this.onTimeUpdateCallback) this.onTimeUpdateCallback(this.audioElement.currentTime);
          } else if (this.isSynthPlaying) {
            this.syntheticCurrentTime += 0.5;
            if (this.onTimeUpdateCallback) this.onTimeUpdateCallback(this.syntheticCurrentTime);
          }
        }, 250);
      }

      stopProgressTicker() {
        if (this.tickerInterval) {
          clearInterval(this.tickerInterval);
          this.tickerInterval = null;
        }
      }

      playTrack(trackId, audioUrl, onTimeUpdate, onEnded, onError) {
        this.currentTrackId = trackId;
        this.onTimeUpdateCallback = onTimeUpdate || null;
        this.onEndedCallback = onEnded || null;
        this.onErrorCallback = onError || null;
        this.syntheticCurrentTime = 0;
        this.triggerHaptic('medium');

        if (!this.audioElement) this.audioElement = new Audio();
        this.stopProgressTicker();
        this.stopSynth();

        const targetUrl = audioUrl && audioUrl.startsWith('http') ? audioUrl : DEFAULT_WORKING_MP3;
        this.currentAudioUrl = targetUrl;

        this.audioElement.ontimeupdate = () => {
          if (this.audioElement && !isNaN(this.audioElement.currentTime)) {
            this.syntheticCurrentTime = this.audioElement.currentTime;
            if (this.onTimeUpdateCallback) this.onTimeUpdateCallback(this.audioElement.currentTime);
          }
        };

        this.audioElement.onended = () => {
          this.stopProgressTicker();
          this.stopSynth();
          if (this.onEndedCallback) this.onEndedCallback();
        };

        this.audioElement.onerror = () => {
          if (this.audioElement && this.currentAudioUrl !== DEFAULT_WORKING_MP3) {
            this.currentAudioUrl = DEFAULT_WORKING_MP3;
            this.audioElement.src = DEFAULT_WORKING_MP3;
            this.audioElement.load();
            this.audioElement.play().catch(() => this.startSynthFallback(220));
          } else {
            this.startSynthFallback(220);
          }
          if (this.onErrorCallback) this.onErrorCallback();
        };

        this.audioElement.src = targetUrl;
        this.audioElement.currentTime = 0;
        this.audioElement.load();

        const p = this.audioElement.play();
        if (p !== undefined) {
          p.then(() => {
            this.stopSynth();
            this.startProgressTicker();
          }).catch(() => {
            if (targetUrl !== DEFAULT_WORKING_MP3) {
              this.audioElement.src = DEFAULT_WORKING_MP3;
              this.audioElement.load();
              this.audioElement.play().then(() => this.startProgressTicker()).catch(() => {
                this.startSynthFallback(220);
                this.startProgressTicker();
              });
            } else {
              this.startSynthFallback(220);
              this.startProgressTicker();
            }
          });
        } else {
          this.startProgressTicker();
        }
      }

      pause() {
        this.triggerHaptic('light');
        if (this.audioElement) this.audioElement.pause();
        this.stopProgressTicker();
        this.stopSynth();
      }

      resume() {
        this.triggerHaptic('light');
        if (this.audioElement && this.audioElement.src) {
          const p = this.audioElement.play();
          if (p !== undefined) {
            p.then(() => this.startProgressTicker()).catch(() => {
              this.startSynthFallback(220);
              this.startProgressTicker();
            });
          } else {
            this.startProgressTicker();
          }
        } else if (this.currentTrackId) {
          this.startSynthFallback(220);
          this.startProgressTicker();
        }
      }

      seek(seconds) {
        this.syntheticCurrentTime = seconds;
        if (this.audioElement && !isNaN(seconds)) {
          try { this.audioElement.currentTime = seconds; } catch(e) {}
        }
        if (this.onTimeUpdateCallback) this.onTimeUpdateCallback(seconds);
      }

      setVolume(val) {
        if (this.audioElement) this.audioElement.volume = Math.max(0, Math.min(1, val));
        if (this.synthGain && this.audioCtx) {
          this.synthGain.gain.setValueAtTime(val * 0.1, this.audioCtx.currentTime);
        }
      }

      getVisualizerData() {
        if (this.analyser) {
          const dataArray = new Uint8Array(this.analyser.frequencyBinCount);
          this.analyser.getByteFrequencyData(dataArray);
          return Array.from(dataArray.slice(0, 16));
        }
        return Array.from({ length: 16 }, () => Math.floor(Math.random() * 80) + 20);
      }
    }

    const audioEngine = new AudioEngine();

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    async function downloadTrackMp3(track) {
      audioEngine.triggerHaptic('notification');
      const filename = `${track.artist} - ${track.title}.mp3`.replace(/[/\\?%*:|"<>]/g, '');
      const urlToDownload = track.audioUrl && track.audioUrl.startsWith('http') ? track.audioUrl : DEFAULT_WORKING_MP3;
      try {
        const response = await fetch(urlToDownload, { mode: 'cors' });
        if (response.ok) {
          const blob = await response.blob();
          const blobUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
          return;
        }
      } catch (e) {}
      const a = document.createElement('a');
      a.href = urlToDownload;
      a.download = filename;
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function normalizeSearchString(str) {
      if (!str) return '';
      return str.toLowerCase().replace(/ı/g, 'i').replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ş/g, 's').replace(/ö/g, 'o').replace(/ç/g, 'c').trim();
    }

    function searchStandaloneDatabase(query, existingTracks) {
      if (!query || query.trim().length === 0) return [];
      const rawQuery = query.trim();
      const normalizedQuery = normalizeSearchString(rawQuery);
      const queryTokens = normalizedQuery.split(/\s+/).filter(Boolean);

      const matches = existingTracks.filter((t) => {
        const titleNorm = normalizeSearchString(t.title);
        const artistNorm = normalizeSearchString(t.artist);
        return queryTokens.every((token) => titleNorm.includes(token) || artistNorm.includes(token));
      });

      if (matches.length >= 2) return matches;

      const capitalizedQuery = rawQuery.charAt(0).toUpperCase() + rawQuery.slice(1);
      return [
        ...matches,
        {
          id: `standalone-1-${normalizedQuery}`,
          title: `${capitalizedQuery} (Original Hit)`,
          artist: 'Sanatçı',
          album: 'Global Release',
          coverUrl: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop&q=80',
          duration: 210,
          genre: 'Hit Songs',
          audioUrl: DEFAULT_WORKING_MP3,
          isLiked: false,
          isDownloaded: false
        }
      ];
    }

                <Icon name="heartFilled" className="w-6 h-6 text-white" />
              </div>
              <div>
                <h3 className="text-base font-extrabold text-white">Beğenilen Şarkılar</h3>
                <p className="text-xs text-purple-200">{likedTracks.length} Parça</p>
              </div>
            </div>
          </div>

          <div className="space-y-2">
            <h3 className="text-xs uppercase font-bold text-gray-400">Çalma Listelerin</h3>
            {playlists.map((pl) => (
              <div key={pl.id} onClick={() => onSelectPlaylist(pl)} className="bg-zinc-900 p-2.5 rounded-2xl flex items-center justify-between cursor-pointer">
                <div className="flex items-center space-x-3">
                  <img src={pl.coverUrl} alt={pl.title} className="w-12 h-12 rounded-xl object-cover" />
                  <div>
                    <h4 className="text-xs font-bold text-white">{pl.title}</h4>
                    <p className="text-[11px] text-gray-400">{pl.tracks.length} Şarkı</p>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    // -------------------------------------------------------------
    // MINI PLAYER COMPONENT
    // -------------------------------------------------------------
    const MiniPlayer = ({ currentTrack, isPlaying, currentTime, onPlayPause, onToggleLike, onToggleDownload, onOpenFullPlayer }) => {
      if (!currentTrack) return null;
      const progressPercent = currentTrack.duration > 0 ? Math.min(100, (currentTime / currentTrack.duration) * 100) : 0;

      return (
        <div className="fixed bottom-[60px] left-2 right-2 z-30 max-w-lg mx-auto">
          <div onClick={onOpenFullPlayer} className="relative bg-zinc-900/95 backdrop-blur-xl border border-white/10 rounded-2xl p-2.5 flex items-center justify-between cursor-pointer">
            <div className="absolute top-0 left-3 right-3 h-[2px] bg-white/10 rounded-full overflow-hidden">
              <div className="h-full bg-emerald-500" style={{ width: `${progressPercent}%` }} />
            </div>
            <div className="flex items-center space-x-3 overflow-hidden">
              <img src={currentTrack.coverUrl} alt={currentTrack.title} className="w-11 h-11 rounded-xl object-cover" />
              <div className="min-w-0">
                <h4 className="text-sm font-bold text-white truncate">{currentTrack.title}</h4>
                <p className="text-xs text-gray-400 truncate">{currentTrack.artist}</p>
              </div>
            </div>
            <div className="flex items-center space-x-2">
              <button onClick={(e) => { e.stopPropagation(); onPlayPause(); }} className="w-10 h-10 rounded-full bg-emerald-500 text-black flex items-center justify-center">
                <Icon name={isPlaying ? "pause" : "play"} className="w-5 h-5" />
              </button>
              <button onClick={(e) => { e.stopPropagation(); onOpenFullPlayer(); }} className="p-2 text-gray-400">
                <Icon name="maximize2" className="w-4 h-4" />
              </button>
            </div>
          </div>
        </div>
      );
    };

    // -------------------------------------------------------------
    // FULL PLAYER MODAL
    // -------------------------------------------------------------
    const FullPlayerModal = ({ currentTrack, isPlaying, currentTime, isShuffle, isRepeat, onClose, onPlayPause, onNext, onPrev, onToggleShuffle, onToggleRepeat, onSeek, onToggleLike, onToggleDownload, onShareTelegram }) => {
      if (!currentTrack) return null;

      return (
        <div className="fixed inset-0 z-50 bg-gradient-to-b from-zinc-900 via-neutral-950 to-black text-white flex flex-col justify-between p-6 overflow-y-auto">
          <div className="flex items-center justify-between pb-4 border-b border-white/10">
            <button onClick={onClose} className="p-2.5 rounded-full bg-white/10">
              <Icon name="chevronDown" className="w-6 h-6" />
            </button>
            <div className="text-center">
              <span className="text-[10px] uppercase font-bold text-emerald-400">Telegram Music Player</span>
              <h3 className="text-xs font-semibold text-gray-300 truncate">{currentTrack.album}</h3>
            </div>
            <button onClick={() => onShareTelegram(currentTrack)} className="p-2.5 rounded-full bg-emerald-500/20 text-emerald-400">
              <Icon name="share2" className="w-5 h-5" />
            </button>
          </div>

          <div className="my-auto flex flex-col items-center justify-center py-4">
            <div className="w-64 h-64 sm:w-80 sm:h-80 rounded-3xl overflow-hidden shadow-2xl">
              <img src={currentTrack.coverUrl} alt={currentTrack.title} className="w-full h-full object-cover" />
            </div>
            <div className="w-full max-w-md mt-6 flex items-center justify-between">
              <div>
                <h2 className="text-xl font-extrabold text-white">{currentTrack.title}</h2>
                <p className="text-sm text-gray-400">{currentTrack.artist}</p>
              </div>
              <button onClick={() => onToggleLike(currentTrack.id)}>
                <Icon name={currentTrack.isLiked ? "heartFilled" : "heart"} className={`w-7 h-7 ${currentTrack.isLiked ? 'text-red-500' : 'text-gray-400'}`} />
              </button>
            </div>
          </div>

          <div className="w-full max-w-md mx-auto space-y-4">
            <input
              type="range"
              min="0"
              max={currentTrack.duration || 100}
              value={currentTime}
              onChange={(e) => onSeek(parseFloat(e.target.value))}
              className="w-full h-1.5 bg-white/20 rounded-lg accent-emerald-500"
            />
            <div className="flex justify-between text-xs text-gray-400">
              <span>{formatTime(currentTime)}</span>
              <span>{formatTime(currentTrack.duration)}</span>
            </div>

            <div className="flex items-center justify-between px-2">
              <button onClick={onToggleShuffle} className={isShuffle ? 'text-emerald-400' : 'text-gray-400'}>
                <Icon name="shuffle" className="w-5 h-5" />
              </button>
              <button onClick={onPrev} className="text-white">
                <Icon name="skipBack" className="w-7 h-7" />
              </button>
              <button onClick={onPlayPause} className="w-16 h-16 rounded-full bg-emerald-500 text-black flex items-center justify-center">
                <Icon name={isPlaying ? "pause" : "play"} className="w-8 h-8" />
              </button>
              <button onClick={onNext} className="text-white">
                <Icon name="skipForward" className="w-7 h-7" />
              </button>
              <button onClick={onToggleRepeat} className={isRepeat ? 'text-emerald-400' : 'text-gray-400'}>
                <Icon name="repeat" className="w-5 h-5" />
              </button>
            </div>
          </div>
        </div>
      );
    };

    // -------------------------------------------------------------
    // MAIN APP COMPONENT
    // -------------------------------------------------------------
    function App() {
      const [tracks, setTracks] = useState(() => {
        const saved = localStorage.getItem('tg_music_tracks');
        return saved ? JSON.parse(saved) : INITIAL_TRACKS;
      });

      const [playlists, setPlaylists] = useState(() => {
        const saved = localStorage.getItem('tg_music_playlists');
        return saved ? JSON.parse(saved) : INITIAL_PLAYLISTS;
      });

      const [activeTab, setActiveTab] = useState('home');
      const [currentTrack, setCurrentTrack] = useState(INITIAL_TRACKS[0]);
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);
      const [isShuffle, setIsShuffle] = useState(false);
      const [isRepeat, setIsRepeat] = useState(false);
      const [theme, setTheme] = useState('spotify-dark');

      const [selectedPlaylist, setSelectedPlaylist] = useState(null);
      const [isFullPlayerOpen, setIsFullPlayerOpen] = useState(false);
      const [isCreatePlaylistOpen, setIsCreatePlaylistOpen] = useState(false);
      const [isShareModalOpen, setIsShareModalOpen] = useState(false);

      const [user, setUser] = useState({
        id: 1001,
        first_name: 'Ahmet',
        username: 'ahmet_dev',
        is_premium: true,
        photo_url: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&auto=format&fit=crop&q=80'
      });

      useEffect(() => {
        try {
          const tg = window.Telegram?.WebApp;
          if (tg) {
            tg.ready();
            tg.expand();
            if (tg.initDataUnsafe?.user) {
              const u = tg.initDataUnsafe.user;
              setUser({
                id: u.id,
                first_name: u.first_name || 'Kullanıcı',
                username: u.username || '',
                is_premium: u.is_premium || false,
                photo_url: u.photo_url || ''
              });
            }
          }
        } catch(e) {}
      }, []);

      useEffect(() => {
        localStorage.setItem('tg_music_tracks', JSON.stringify(tracks));
      }, [tracks]);

      useEffect(() => {
        localStorage.setItem('tg_music_playlists', JSON.stringify(playlists));
      }, [playlists]);

      const handlePlayTrack = (track) => {
        setCurrentTrack(track);
        setIsPlaying(true);
        audioEngine.playTrack(
          track.id,
          track.audioUrl,
          (time) => setCurrentTime(time),
          () => handleNextTrack()
        );
      };

      const handlePlayPause = () => {
        if (isPlaying) {
          audioEngine.pause();
          setIsPlaying(false);
        } else {
          if (currentTime === 0 && currentTrack) {
            handlePlayTrack(currentTrack);
          } else {
            audioEngine.resume();
            setIsPlaying(true);
          }
        }
      };

      const handleNextTrack = () => {
        if (!currentTrack) return;
        const index = tracks.findIndex((t) => t.id === currentTrack.id);
        const nextIndex = (index + 1) % tracks.length;
        handlePlayTrack(tracks[nextIndex]);
      };

      const handlePrevTrack = () => {
        if (!currentTrack) return;
        const index = tracks.findIndex((t) => t.id === currentTrack.id);
        const prevIndex = index === 0 ? tracks.length - 1 : index - 1;
        handlePlayTrack(tracks[prevIndex]);
      };

      const handleToggleLike = (trackId) => {
        setTracks((prev) => prev.map((t) => t.id === trackId ? { ...t, isLiked: !t.isLiked } : t));
      };

      const handleToggleDownload = (trackId) => {
        setTracks((prev) => prev.map((t) => t.id === trackId ? { ...t, isDownloaded: !t.isDownloaded } : t));
      };

      const downloadedCount = tracks.filter((t) => t.isDownloaded).length;

      return (
        <div className="min-h-screen bg-zinc-950 text-white font-sans antialiased selection:bg-emerald-500">
          <Header
            user={user}
            theme={theme}
            onThemeChange={(t) => setTheme(t)}
            onShareApp={() => setIsShareModalOpen(true)}
          />

          <main className="transition-all duration-300">
            {activeTab === 'home' && (
              <HomePage
                tracks={tracks}
                playlists={playlists}
                artists={POPULAR_ARTISTS}
                currentTrack={currentTrack}
                isPlaying={isPlaying}
                onPlayTrack={handlePlayTrack}
                onSelectPlaylist={(pl) => setSelectedPlaylist(pl)}
                onToggleLike={handleToggleLike}
                onToggleDownload={handleToggleDownload}
              />
            )}

            {activeTab === 'search' && (
              <SearchPage
                tracks={tracks}
                playlists={playlists}
                currentTrack={currentTrack}
                isPlaying={isPlaying}
                onPlayTrack={handlePlayTrack}
                onSelectPlaylist={(pl) => setSelectedPlaylist(pl)}
                onToggleLike={handleToggleLike}
                onToggleDownload={handleToggleDownload}
              />
            )}

            {activeTab === 'library' && (
              <LibraryPage
                tracks={tracks}
                playlists={playlists}
                currentTrack={currentTrack}
                isPlaying={isPlaying}
                onPlayTrack={handlePlayTrack}
                onSelectPlaylist={(pl) => setSelectedPlaylist(pl)}
                onCreatePlaylistOpen={() => setIsCreatePlaylistOpen(true)}
                onDeletePlaylist={(id) => setPlaylists(p => p.filter(x => x.id !== id))}
                onToggleLike={handleToggleLike}
                onToggleDownload={handleToggleDownload}
              />
            )}
          </main>

          <MiniPlayer
            currentTrack={currentTrack}
            isPlaying={isPlaying}
            currentTime={currentTime}
            onPlayPause={handlePlayPause}
            onToggleLike={handleToggleLike}
            onToggleDownload={handleToggleDownload}
            onOpenFullPlayer={() => setIsFullPlayerOpen(true)}
          />

          <BottomNav
            currentTab={activeTab}
            onTabChange={(t) => setActiveTab(t)}
            downloadedCount={downloadedCount}
          />

          {isFullPlayerOpen && (
            <FullPlayerModal
              currentTrack={currentTrack}
              isPlaying={isPlaying}
              currentTime={currentTime}
              isShuffle={isShuffle}
              isRepeat={isRepeat}
              onClose={() => setIsFullPlayerOpen(false)}
              onPlayPause={handlePlayPause}
              onNext={handleNextTrack}
              onPrev={handlePrevTrack}
              onToggleShuffle={() => setIsShuffle(!isShuffle)}
              onToggleRepeat={() => setIsRepeat(!isRepeat)}
              onSeek={(s) => audioEngine.seek(s)}
              onToggleLike={handleToggleLike}
              onToggleDownload={handleToggleDownload}
              onShareTelegram={() => setIsShareModalOpen(true)}
            />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
